spring:
  ai:
    google:
      genai:
        api-key: ${GRADEOPS_GEMINI_API_KEY}
        chat:
          options:
            model: ${GRADEOPS_GEMINI_MODEL}
    openai:
      api-key: ${GRADEOPS_GROQ_API_KEY}
      base-url: ${GRADEOPS_GROQ_BASE_URL:https://api.groq.com/openai/v1}
      chat:
        options:
          model: ${GRADEOPS_GROQ_MODEL}

# ChatClientAutoConfiguration requires exactly one ChatModel bean; with both Google GenAI's and
# OpenAI's (Groq) starters present it finds two (googleGenAiChatModel, openAiChatModel) and fails
# to start. AssessmentConfig builds each provider's ChatClient directly from its own uniquely
# named ChatModel bean instead — see AssessmentConfig.java.
  autoconfigure:
    exclude:
      - org.springframework.ai.model.chat.client.autoconfigure.ChatClientAutoConfiguration
