# Smoke-test stack: real Postgres + a real Firebase Auth Emulator (not real Firebase).
# Usage: see scripts/smoke-test.sh — it drives this file end to end (up, wait, boot api/,
# run verification requests, tear down). To just bring the stack up manually:
#   docker compose -f compose.smoke.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gradeops
      POSTGRES_USER: gradeops
      POSTGRES_PASSWORD: gradeops
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradeops -d gradeops"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No named volume: each smoke run starts from an empty database on purpose.

  firebase-emulator:
    build:
      context: ./docker/firebase-emulator
    ports:
      - "9099:9099"
    healthcheck:
      # 127.0.0.1, not localhost — Alpine's DNS resolution prefers ::1 (IPv6) for
      # "localhost" inside the container, where the emulator isn't listening, even
      # though the IPv4 0.0.0.0 binding is reachable fine from the host via the
      # published port.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9099/emulator/v1/projects/demo-gradeops-smoke/config"]
      interval: 5s
      timeout: 5s
      retries: 20
